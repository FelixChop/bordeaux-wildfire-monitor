<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>🔥 Bordeaux — Risque Feu de Forêt</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{
      --bg:#12100f; --panel:rgba(24,20,18,.92); --line:#3a2a22;
      --fire:#ff5722; --fire2:#ff9800; --ok:#4caf50; --warn:#ffb300; --txt:#f5f0ec; --muted:#b8a79d;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);color:var(--txt);}
    #map{position:fixed;inset:0;z-index:0;background:#0c0a09}

    /* ---- top bar ---- */
    .topbar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:8px;
      padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
      background:linear-gradient(180deg,rgba(12,10,9,.92),rgba(12,10,9,0));pointer-events:none}
    .title{font-size:15px;font-weight:700;letter-spacing:.2px;text-shadow:0 1px 4px #000}
    .title small{display:block;font-weight:500;color:var(--muted);font-size:11px}
    .live{margin-left:auto;pointer-events:auto;display:flex;align-items:center;gap:6px;
      background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:11px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
    @keyframes pulse{50%{opacity:.35}}

    /* ---- stats panel (bottom sheet on mobile, side card on desktop) ---- */
    .panel{position:fixed;z-index:1000;background:var(--panel);backdrop-filter:blur(12px);
      border:1px solid var(--line);color:var(--txt);
      left:8px;right:8px;bottom:calc(var(--tl-h) + 8px);border-radius:16px;
      max-height:46vh;overflow-y:auto;transition:max-height .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.5)}
    .panel.collapsed{max-height:46px;overflow:hidden}
    .panel.collapsed .body{display:none}
    .panel-head{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;gap:8px;
      padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
    .panel-head h2{font-size:13px;color:var(--fire2);letter-spacing:.5px;flex:1}
    .chev{transition:transform .3s}
    .panel.collapsed .chev{transform:rotate(180deg)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
    .stat{background:rgba(0,0,0,.28);border-left:3px solid var(--fire2);border-radius:8px;padding:8px 10px}
    .stat .l{font-size:10.5px;color:var(--muted);margin-bottom:2px}
    .stat .v{font-size:16px;font-weight:700}
    .stat.warn{border-color:var(--warn)} .stat.ok{border-color:var(--ok)} .stat.fire{border-color:var(--fire)}
    .src{padding:0 14px 14px;font-size:10px;color:var(--muted);line-height:1.5}

    /* ---- timeline dock ---- */
    :root{--tl-h:118px}
    .timeline{position:fixed;left:0;right:0;bottom:0;z-index:1100;
      padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
      background:linear-gradient(0deg,rgba(12,10,9,.97),rgba(12,10,9,.82));border-top:1px solid var(--line)}
    .modes{display:flex;gap:6px;margin-bottom:10px}
    .mode{flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px 6px;border-radius:10px;
      background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.15s}
    .mode.active{background:var(--fire);border-color:var(--fire);color:#fff;box-shadow:0 2px 12px rgba(255,87,34,.4)}
    .tl-row{display:flex;align-items:center;gap:10px}
    .play{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--fire);color:#fff;
      font-size:17px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 12px rgba(255,87,34,.4)}
    .play:active{transform:scale(.94)}
    .tl-main{flex:1;min-width:0}
    .tl-label{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px}
    .tl-label b{color:var(--fire2);font-variant-numeric:tabular-nums}
    .tl-label span{color:var(--muted)}
    .tl-legend{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:3px}
    .tl-legend #tlNow{color:#ff5252}
    .live-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;
      background:rgba(198,40,40,.15);border:1px solid #c62828;border-radius:12px;padding:6px 9px;
      color:#ff5252;font-size:9px;font-weight:700;cursor:pointer;line-height:1}
    .live-btn span{font-size:9px}
    .live-btn.on{background:#c62828;color:#fff}
    /* track: past (warm) up to "now", forecast (cool) after */
    input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;
      background:linear-gradient(90deg,#8a3b00 0%,var(--fire) var(--nowpct,50%),
      #2a3a4a var(--nowpct,50%),#3d5266 100%);outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
      background:#fff;border:3px solid var(--fire);cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.5)}
    input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--fire);cursor:pointer}

    .loading{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:var(--bg);
      text-align:center;transition:opacity .4s}
    .loading.hide{opacity:0;pointer-events:none}
    .spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--fire);border-radius:50%;
      animation:rot 1s linear infinite;margin:0 auto 14px}
    @keyframes rot{to{transform:rotate(360deg)}}

    .layers{position:fixed;z-index:1000;right:8px;top:calc(env(safe-area-inset-top) + 52px);
      display:flex;flex-direction:column;gap:5px;align-items:flex-end;pointer-events:auto}
    .lyr{background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:20px;
      padding:5px 10px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
    .lyr.on{background:rgba(46,125,50,.85);border-color:#2e7d32;color:#fff}
    #trafBtn.on{background:rgba(198,40,40,.85);border-color:#c62828}
    #airBtn.on{background:rgba(2,119,189,.9);border-color:#0277bd}
    #staBtn.on{background:rgba(198,40,40,.85);border-color:#c62828}
    @media(min-width:820px){.layers{top:110px}}
    .leaflet-bottom.leaflet-left{bottom:calc(var(--tl-h) + 64px)}
    .legend{background:rgba(0,0,0,.6);border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.7;color:#eee}
    .aclabel{background:rgba(2,119,189,.9)!important;border:none!important;color:#fff!important;font-weight:700;font-size:10.5px;padding:2px 6px!important;border-radius:6px!important;box-shadow:0 1px 4px #000}
    .aclabel:before{display:none!important}
    .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}

    /* ---- desktop ---- */
    @media (min-width:820px){
      :root{--tl-h:96px}
      .title{font-size:18px}
      .panel{left:auto;right:14px;top:64px;bottom:auto;width:330px;max-height:calc(100vh - 64px - var(--tl-h) - 24px)}
      .panel.collapsed{transform:none}
      .panel.collapsed .body{display:none}
      .timeline{left:50%;right:auto;transform:translateX(-50%);width:min(680px,calc(100vw - 380px));
        border:1px solid var(--line);border-radius:16px;bottom:14px}
    }
  </style>
</head>
<body>
  <div class="loading" id="loading"><div><div class="spin"></div>Chargement des données temps réel…</div></div>

  <div id="map"></div>

  <div class="topbar">
    <div class="title">🔥 Feu de forêt — Bordeaux<small>NASA FIRMS · vent Open-Meteo · végétation NDVI</small></div>
    <div class="live"><span class="dot"></span><span id="liveTxt">en direct</span></div>
  </div>

  <div class="layers">
    <div class="lyr" id="airqBtn" onclick="toggleAirQ()">🌫️ Qualité air</div>
    <div class="lyr" id="trafBtn" onclick="toggleLayer('traffic')">🚦 Trafic</div>
    <div class="lyr on" id="suppBtn" onclick="toggleSupp()">🚒 Avec lutte</div>
  </div>

  <div class="panel collapsed" id="panel">
    <div class="panel-head" onclick="togglePanel()">
      <h2 id="panelTitle">📊 SITUATION</h2>
      <span class="chev">▲</span>
    </div>
    <div class="body">
      <div class="grid" id="stats"></div>
      <div class="src" id="src"></div>
    </div>
  </div>

  <div class="timeline">
    <div class="tl-row">
      <button class="play" id="play" onclick="togglePlay()">▶</button>
      <div class="tl-main">
        <div class="tl-label"><b id="tlTime">—</b><span id="tlInfo"></span></div>
        <input type="range" id="slider" min="0" max="0" value="0" step="1" oninput="onSlide(this.value)">
        <div class="tl-legend"><span>◀ 5 j passés (feux actifs)</span><span id="tlNow">● maintenant</span><span>prévision 7 j ▶</span></div>
      </div>
      <button class="live-btn" id="liveBtn" onclick="goLive()">🔴<span>Direct</span></button>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const BDX=[44.837,-0.579];
// Vue verrouillée : de l'océan (Lacanau océan) à Bordeaux rive droite.
const VIEW=L.latLngBounds([[44.60,-1.30],[45.06,-0.48]]);
const map=L.map('map',{zoomControl:false,attributionControl:false,preferCanvas:true,
  dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,
  boxZoom:false,keyboard:false,zoomSnap:0.1}).fitBounds(VIEW);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
L.marker(BDX).addTo(map).bindPopup('Bordeaux');
function lockView(){ map.fitBounds(VIEW,{padding:[6,6]}); }
window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(lockView,200); });

// layers
let firePts=L.layerGroup().addTo(map);   // past hotspots
let simLayer=L.layerGroup().addTo(map);   // simulation polygons
let windLayer=L.layerGroup().addTo(map);  // wind-field arrows

let state={frames:[], nowIdx:0, idx:0, playing:false, timer:null,
           data:null, wind:null, airHist:null, meteo:null};

const $=id=>document.getElementById(id);
const fmtT=iso=>{ if(!iso) return '—'; const d=new Date(iso.replace(' ','T'));
  return d.toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
const ago=iso=>{ if(!iso) return ''; const m=Math.round((Date.now()-new Date(iso.replace(' ','T')))/60000);
  if(m<60) return 'il y a '+m+' min'; const h=Math.round(m/60); return h<48?'il y a '+h+' h':'il y a '+Math.round(h/24)+' j'; };

async function getJSON(url, tries=20){
  for(let i=0;i<tries;i++){
    const r=await fetch(url);
    if(r.ok) return r.json();
    if(r.status===503){ await new Promise(s=>setTimeout(s,3000)); continue; } // data warming up
    throw new Error(url+' → '+r.status);
  }
  throw new Error(url+' : données indisponibles');
}
async function boot(){
  try{
    const data=await getJSON('/api/data');           // wait until data is warm
    const [past,simLutte,simLibre,wind,meteo]=await Promise.all([
      getJSON('/api/fire-history'),
      getJSON('/api/simulation?mode=lutte',60),
      getJSON('/api/simulation?mode=libre',60),
      getJSON('/api/windfield').catch(()=>null),
      fetch('/api/meteosat').then(r=>r.json()).catch(()=>null)
    ]);
    state.data=data; state.wind=wind; state.meteo=meteo;
    state.past=past; state.sims={lutte:simLutte,libre:simLibre}; state.simMode='lutte';
    // wind lookup by hour-timestamp (covers past 5 d + forecast 8 d)
    state.windIdx={};
    if(wind&&wind.times) wind.times.forEach((t,k)=>{state.windIdx[t.slice(0,13)]=k;});
    // compact fire points + window
    state.firePts=past.points||[]; state.winH=past.window_h||24;
    buildTimeline();
    renderStats();
    lockView();
    addVeg();             // vegetation base layer, always on
    goLive();             // start at the present
    $('loading').classList.add('hide');
  }catch(e){ $('loading').innerHTML='<div>Erreur de chargement.<br><small>'+e+'</small></div>'; }
}

function renderStats(){
  const d=state.data; if(!d) return;
  const fp=d.fire_perimeter, wind=(d.wind.hourly_wind||[]).slice(0,24);
  const avgS=wind.length?wind.reduce((a,w)=>a+(w.wind_speed_10m_ms||0),0)/wind.length:0;
  // circular mean of wind direction
  let ss=0,cc=0; wind.forEach(w=>{const r=(w.wind_direction_10m_deg||0)*Math.PI/180; ss+=Math.sin(r); cc+=Math.cos(r);});
  const avgD=(Math.atan2(ss,cc)*180/Math.PI+360)%360;
  const away=fp.distance_to_bordeaux_km>20;
  const lastDet=d.firms&&d.firms.last_detection;
  const sats=(d.firms&&d.firms.satellites||[]).join(', ');
  $('stats').innerHTML=`
    <div class="stat fire"><div class="l">🔥 Distance du feu</div><div class="v">${fp.distance_to_bordeaux_km.toFixed(1)} km</div></div>
    <div class="stat"><div class="l">🔴 Foyers actifs (5 j)</div><div class="v">${fp.n_hotspots}</div></div>
    <div class="stat"><div class="l">💨 Vent moyen (24 h)</div><div class="v">${avgS.toFixed(1)} m/s ${dirLabel(avgD)}</div></div>
    <div class="stat ${away?'ok':'warn'}"><div class="l">⚠️ Risque Bordeaux</div><div class="v">${away?'Faible':'À surveiller'}</div></div>
    <div class="stat" style="grid-column:1/-1"><div class="l">🛰️ Dernier passage satellite (foyers précis)</div><div class="v">${lastDet?fmtT(lastDet)+' ('+ago(lastDet)+')':'—'}</div></div>
    ${meteoTile(state.meteo)}
    ${airTile(d.air)}`;
  $('src').innerHTML=`Foyers : NASA FIRMS ${sats?'('+sats+')':''} · Météo : Open-Meteo · Végétation : NDVI MODIS<br>Surveillance actualisée chaque heure · dernière vérif : ${fmtT(d.timestamp+'Z')}`;
}
function dirLabel(d){const dirs=['N','NE','E','SE','S','SO','O','NO'];return 'de '+dirs[Math.round(d/45)%8];}
const fmt=v=>v==null?'—':Math.round(v);
function aqiInfo(a){
  if(a==null) return {t:'—',c:''};
  if(a<=20) return {t:'Bon',c:'ok'};
  if(a<=40) return {t:'Correct',c:'ok'};
  if(a<=60) return {t:'Moyen',c:'warn'};
  if(a<=80) return {t:'Mauvais',c:'warn'};
  if(a<=100) return {t:'Très mauvais',c:'fire'};
  return {t:'Extrême',c:'fire'};
}
function meteoTile(m){
  if(!m||!m.available) return '';
  const n=(m.fires||[]).length;
  const cls=n>0?'fire':'ok';
  return `<div class="stat ${cls}" style="grid-column:1/-1"><div class="l">🔥 Détection géostationnaire (~10 min)</div>`+
    `<div class="v">${m.time?ago(m.time):'—'}${n>0?' · '+n+' point(s) feu Gironde':' · rien sur zone'}</div>`+
    `<div class="l" style="margin-top:3px">Meteosat MTG — comble les 2 passages/jour</div></div>`;
}
function airTile(air){
  if(!air) return '';
  const i=aqiInfo(air.aqi);
  return `<div class="stat ${i.c}" style="grid-column:1/-1"><div class="l">🌫️ Qualité de l'air (Bordeaux)</div>`+
    `<div class="v">${i.t}${air.aqi!=null?' · indice '+Math.round(air.aqi):''}</div>`+
    `<div class="l" style="margin-top:4px">PM2.5 ${fmt(air.pm2_5)} · PM10 ${fmt(air.pm10)} · CO ${fmt(air.co)} µg/m³</div></div>`;
}

function buildTimeline(){
  const past=state.past, sim=state.sims[state.simMode]||{frames:[]};
  const startMs=Date.parse(past.start);
  const pf=[]; for(let k=0;k<past.n_hours;k++)
    pf.push({kind:'past',hIdx:k,timestamp:new Date(startMs+k*3600e3).toISOString().slice(0,16)+'Z'});
  const sf=(sim.frames||[]).map(f=>({kind:'sim',...f}));
  state.frames=pf.concat(sf);
  state.nowIdx=Math.max(pf.length-1,0);
  state.simPts=[];
  sf.forEach(g=>(g.new_points||[]).forEach(q=>state.simPts.push({lat:q[0],lon:q[1],h:q[2]})));
  const sl=$('slider'); sl.min=0; sl.max=Math.max(state.frames.length-1,0);
  document.documentElement.style.setProperty('--nowpct',
    (state.nowIdx/Math.max(state.frames.length-1,1)*100)+'%');
}
function toggleSupp(){
  state.simMode=(state.simMode==='lutte')?'libre':'lutte';
  $('suppBtn').classList.toggle('on', state.simMode==='lutte');
  $('suppBtn').textContent=(state.simMode==='lutte')?'🚒 Avec lutte':'🔥 Feu libre';
  const keep=Math.min(state.idx, state.frames.length-1);
  buildTimeline();
  render(Math.min(keep, +$('slider').max));
}
function onSlide(v){ if(state.playing) stop(); render(+v); }
function render(i){
  i=Math.max(0,Math.min(i, +$('slider').max)); state.idx=i; $('slider').value=i;
  firePts.clearLayers(); simLayer.clearLayers(); windLayer.clearLayers();
  const f=state.frames[i]; if(!f){ $('tlTime').textContent='—'; return; }
  $('liveBtn').classList.toggle('on', i===state.nowIdx);
  if(f.kind==='past') renderPastFrame(f,i); else renderSimFrame(f,i);
}
function goLive(){ if(state.playing) stop(); render(state.nowIdx); }

function drawWindAt(ts){
  const w=state.wind; if(!w||!w.speed||!ts) return;
  const k=state.windIdx[ts.slice(0,13)]; if(k==null) return;
  for(let a=0;a<w.grid_lats.length;a++){
    for(let b=0;b<w.grid_lons.length;b++){
      const s=w.speed[k][a][b], dir=w.dir[k][a][b];
      const t=(w.temp&&w.temp[k])?Math.round(w.temp[k][a][b]):null;
      const rot=(dir+90); // arrow ➤ points east by default; wind blows toward dir+180
      const size=9+Math.min(s,22)*1.1;          // la TAILLE encode la force
      const ic=L.divIcon({className:'wind-arrow',iconSize:[size,size+12],
        html:`<div style="transform:rotate(${rot}deg);color:rgba(255,255,255,.78);font-size:${size}px;line-height:${size}px;text-shadow:0 1px 2px #000">➤</div>`+
             (t!=null?`<div style="font-size:9px;color:#ddd;text-align:center;text-shadow:0 1px 2px #000;opacity:.8;margin-top:1px">${t}°</div>`:'')});
      L.marker([w.grid_lats[a],w.grid_lons[b]],{icon:ic,interactive:false,keyboard:false}).addTo(windLayer);
    }
  }
}

// age-based style: a hotspot is born bright hot, dims to dark ember red, then
// leaves a permanent black scar (burned vegetation).
function ageStyle(age,frp){
  const base=3+Math.min((frp||0)/18,6);
  if(age<2)  return {col:'#ffee58',op:.95,r:base+2};   // naissance : jaune vif
  if(age<6)  return {col:'#ffab00',op:.9, r:base+1};   // pleine activité
  if(age<12) return {col:'#ff5722',op:.8, r:base};     // feu établi
  if(age<18) return {col:'#d32f2f',op:.55,r:base-1};   // décline
  return       {col:'#7f0000',op:.32,r:Math.max(base-2,2)}; // braise mourante
}
// simulated fire: same lifecycle, blue family
function simStyle(age){
  if(age<3)  return {col:'#4dd0ff',op:.95,r:5};
  if(age<8)  return {col:'#29b6f6',op:.85,r:4};
  if(age<16) return {col:'#0277bd',op:.65,r:4};
  return       {col:'#01427a',op:.45,r:3};
}
const SCAR={col:'#141414',op:.55,r:3};   // végétation brûlée
function drawPoint(p,st,layer){
  L.circleMarker([p.lat,p.lon],{radius:st.r,color:st.col,weight:.5,
    fillColor:st.col,fillOpacity:st.op}).addTo(layer);
}
function renderPastFrame(f,i){
  const win=state.winH, h=f.hIdx;
  (state.firePts||[]).forEach(p=>{
    const age=h-p.h;
    if(age<0) return;
    drawPoint(p, age<win?ageStyle(age,p.frp):SCAR, firePts);
  });
  // geostationary fire pixels (Meteosat, ~10 min) — only near "now"
  if(i>=state.nowIdx-2){
    (state.meteo&&state.meteo.fires||[]).forEach(p=>{
      L.rectangle([[p.lat-0.018,p.lon-0.024],[p.lat+0.018,p.lon+0.024]],
        {color:'#ffea00',weight:2,fillColor:'#ffea00',fillOpacity:.5})
        .bindTooltip('Feu Meteosat (~10 min)').addTo(firePts);
    });
  }
  drawWindAt(f.timestamp);
  const live=(i===state.nowIdx);
  const n=(state.firePts||[]).reduce((a,p)=>{const g=h-p.h;return a+(g>=0&&g<win?1:0);},0);
  $('tlTime').textContent=(live?'● DIRECT · ':'⏪ ')+fmtT(f.timestamp);
  $('tlTime').style.color=live?'#ff5252':'var(--fire2)';
  $('tlInfo').textContent=`${n} foyer(s) actif(s)`;
}

function renderSimFrame(f,i){
  const H=f.hour||0;
  // Real hotspots keep aging: embers die, then permanent black scars.
  const effH=state.nowIdx+H;
  (state.firePts||[]).forEach(p=>{
    const age=effH-p.h;
    if(age<0) return;
    drawPoint(p, age<state.winH?ageStyle(age,p.frp):SCAR, firePts);
  });
  // Simulated ignitions: same point UI, blue lifecycle, then black scar too.
  (state.simPts||[]).forEach(p=>{
    const age=H-p.h;
    if(age<0) return;
    drawPoint(p, age<state.winH?simStyle(age):SCAR, simLayer);
  });
  drawWindAt(f.timestamp);
  const j=Math.floor((f.hour||0)/24);
  $('tlTime').textContent=`🔮 ${fmtT(f.timestamp)}`;
  $('tlTime').style.color='#4fc3f7';
  const day=(state.simMode==='lutte'?'🚒 ':'')+(j>0?`J+${j} · `:'prévision · ');
  const tmp=(f.temp_c!=null)?` · air ${f.temp_c}°C`:'';
  const rng=(f.area_p10!=null)?` (${Math.round(f.area_p10/1000)}k–${Math.round(f.area_p90/1000)}k)`:'';
  $('tlInfo').textContent=`${day}${(f.area_ha||0).toLocaleString('fr-FR')} ha${rng} · vent ${f.wind_speed_ms} m/s · ${f.humidity_pct}%${tmp}`;
}

function togglePlay(){ state.playing?stop():play(); }
function play(){
  state.playing=true; $('play').textContent='⏸';
  const max=+$('slider').max;
  if(state.idx>=max) render(0);
  state.timer=setInterval(()=>{
    if(state.idx>=max){ stop(); return; }
    render(state.idx+1);
  }, 130);
}
function stop(){ state.playing=false; $('play').textContent='▶'; if(state.timer){clearInterval(state.timer);state.timer=null;} }

function togglePanel(){ $('panel').classList.toggle('collapsed'); }

// vegetation base layer: ALWAYS on (no toggle) — burned scars darken it
let vegOverlay=null;
function addVeg(){
  // SIM_BBOX = lon[-1.5,-0.5] lat[44.5,45.2]
  vegOverlay=overlayWithRetry('/api/vegetation.png',[[44.5,-1.5],[45.2,-0.5]],
    {opacity:.6,interactive:false}).addTo(map);
}

// ---- ground/response layers (stations, traffic, aircraft) ----
const LYR={
  traffic :{btn:'trafBtn',layer:L.layerGroup(), url:'/api/traffic',  refresh:90, draw:drawTraffic},
};

// smooth CAMS-based air-quality field (wind dispersion already modeled upstream)
let airqOverlay=null, airqTimer=null;
function toggleAirQ(){
  const btn=$('airqBtn');
  if(airqOverlay){
    map.removeLayer(airqOverlay); airqOverlay=null; btn.classList.remove('on');
    if(airqTimer){clearInterval(airqTimer);airqTimer=null;} return;
  }
  const add=()=>{
    if(airqOverlay) map.removeLayer(airqOverlay);
    airqOverlay=L.imageOverlay('/api/air-quality.png?t='+Date.now(),
      [[44.45,-1.45],[45.20,-0.35]],{opacity:.8,interactive:false}).addTo(map);
  };
  add(); btn.classList.add('on');
  airqTimer=setInterval(add, 1800*1000);
}
// retry image overlays that failed while the backend was still warming up
function overlayWithRetry(url,bounds,opts){
  const ov=L.imageOverlay(url+'?t='+Date.now(),bounds,opts);
  ov.on('error',()=>setTimeout(()=>{ if(map.hasLayer(ov)) ov.setUrl(url+'?t='+Date.now()); },8000));
  return ov;
}
async function loadLayer(name,fit){
  const L0=LYR[name];
  try{
    const data=await fetch(L0.url).then(r=>r.json());
    L0.layer.clearLayers();
    const bounds=L0.draw(data,L0.layer);
    if(fit&&bounds&&bounds.isValid&&bounds.isValid()){ bounds.extend(BDX); map.fitBounds(bounds,{padding:[60,60],maxZoom:11}); }
  }catch(e){}
}
function toggleLayer(name){
  const L0=LYR[name], btn=$(L0.btn);
  if(map.hasLayer(L0.layer)){
    map.removeLayer(L0.layer); btn.classList.remove('on');
    if(L0.timer){clearInterval(L0.timer);L0.timer=null;}
  }else{
    L0.layer.addTo(map); btn.classList.add('on'); loadLayer(name);
    if(L0.refresh) L0.timer=setInterval(()=>loadLayer(name), L0.refresh*1000);
  }
}
function drawStations(d,layer){
  (d.stations||[]).forEach(s=>{
    const ic=L.divIcon({className:'',iconSize:[20,20],html:'<div style="font-size:15px;filter:drop-shadow(0 1px 2px #000)">🚒</div>'});
    L.marker([s.lat,s.lon],{icon:ic,interactive:true}).bindTooltip(s.name).addTo(layer);
  });
}
function drawTraffic(d,layer){
  const inc=d.incidents||[];
  inc.forEach(x=>{
    const col=x.closed?'#d50000':(x.cat==='accident'?'#ff1744':x.cat==='travaux'?'#ffa000':'#ff6d00');
    const label=`${x.cat}${x.road?' '+x.road:''}${x.delay?' · +'+Math.round(x.delay/60)+' min':''}`;
    if(x.line&&x.line.length>1)
      L.polyline(x.line,{color:col,weight:x.closed?6:5,opacity:.9}).bindTooltip(label).addTo(layer);
    const emo=x.closed?'⛔':x.cat==='accident'?'⚠️':x.cat==='travaux'?'🚧':'🚗';
    const ic=L.divIcon({className:'',iconSize:[18,18],
      html:`<div style="font-size:14px;filter:drop-shadow(0 1px 2px #000)">${emo}</div>`});
    L.marker(x.pt,{icon:ic}).bindTooltip(label+(x.desc?' — '+x.desc:'')).addTo(layer);
  });
}
function drawAircraft(d,layer){
  const air=d.aircraft||[];
  if(!air.length){
    L.tooltip({permanent:true,direction:'center',className:'noair'})
      .setLatLng([44.6,-0.9]).setContent('Aucun bombardier en vol en France').addTo(layer);
    return null;
  }
  const pts=[];
  air.forEach(a=>{
    if(a.track&&a.track.length>1){
      L.polyline(a.track,{color:'#0277bd',weight:3,opacity:.8,dashArray:'4,4'}).addTo(layer);
      a.track.forEach(p=>pts.push(p));
    }
    pts.push([a.lat,a.lon]);
    const ic=L.divIcon({className:'',iconSize:[26,26],
      html:`<div style="transform:rotate(${a.heading||0}deg);font-size:20px;filter:drop-shadow(0 1px 2px #000)">✈️</div>`});
    L.marker([a.lat,a.lon],{icon:ic,zIndexOffset:1000})
      .bindTooltip(`${a.callsign}${a.alt!=null?' · '+a.alt+' m':''}`,{permanent:true,direction:'top',className:'aclabel'}).addTo(layer);
  });
  return pts.length?L.latLngBounds(pts):null;
}
function log(){}  // placeholder (no-op narrator)

    '<i style="background:#4dd0ff"></i>Foyer simulé (prévision)<br>'+
    '<span style="color:#ffd54f">➤</span> vent (sens + force)';
  return d;};
legend.addTo(map);

boot();
